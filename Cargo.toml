[package]
name = "transmission-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Model Context Protocol server for the Transmission BitTorrent client RPC API"
license = "Unlicense"
repository = "https://github.com/lulkien/transmission-mcp"
readme = "README.md"

[lib]
name = "transmission_mcp"
path = "src/lib.rs"

[[bin]]
name = "transmission-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "net", "time"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"     # the error contract is documented once in src/error.rs
struct_excessive_bools = "allow" # MCP argument structs mirror one wide tool schema on purpose
